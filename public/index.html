<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="78枚のタロットカードで占う、シンプルなWebアプリ。">
  <title>タロット占い</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./js/app.js"></script>
</head>
<body>
  <header class="site-header">
    <a href="./" class="site-name">タロット占い</a>
    <button type="button" class="text-button" id="open-library">カード一覧</button>
  </header>

  <main>
    <section id="reading-setup" aria-labelledby="setup-title">
      <h1 id="setup-title">カードを引く</h1>
      <p class="description">気になるテーマを選んで占えます。</p>

      <div class="field">
        <h2>テーマ</h2>
        <div class="options" id="topics" role="group" aria-label="占うテーマ">
          <button type="button" class="option selected" data-topic="general" aria-pressed="true">今日のこと</button>
          <button type="button" class="option" data-topic="love" aria-pressed="false">恋愛</button>
          <button type="button" class="option" data-topic="work" aria-pressed="false">仕事・将来</button>
          <button type="button" class="option" data-topic="relations" aria-pressed="false">人間関係</button>
        </div>
      </div>

      <div class="field">
        <label for="question" class="field-label">気になること <span class="muted">（任意）</span></label>
        <textarea id="question" rows="3" maxlength="200" placeholder="例：新しいことを始めるか迷っている"></textarea>
      </div>

      <div class="field">
        <h2>枚数</h2>
        <div class="options spreads" id="spreads" role="group" aria-label="カードの引き方">
          <button type="button" class="option selected" data-count="1" aria-pressed="true">1枚引き</button>
          <button type="button" class="option" data-count="3" aria-pressed="false">3枚引き（過去・現在・未来）</button>
        </div>
      </div>

      <button type="button" class="primary" id="draw">占う</button>
    </section>

    <section id="result" hidden aria-live="polite" aria-labelledby="result-title">
      <div class="section-heading">
        <h1 id="result-title">占い結果</h1>
        <button type="button" class="text-button" id="again">もう一度占う</button>
      </div>
      <p id="result-subtitle" class="description"></p>
      <div id="card-grid" class="card-grid"></div>
    </section>

    <section id="library" hidden aria-labelledby="library-title">
      <div class="section-heading">
        <h1 id="library-title">カード一覧</h1>
        <button type="button" class="text-button" id="close-library">占いに戻る</button>
      </div>
      <p class="description">78枚のカードとその意味を確認できます。</p>
      <div id="library-grid" class="library-grid"></div>
      <div id="library-detail" class="library-detail" aria-live="polite"></div>
    </section>
  </main>

  <footer>この占いはエンターテインメントです。相談内容はブラウザ内で処理されます。</footer>
</body>
</html>
